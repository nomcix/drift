name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.202
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --no-restore

  web:
    name: Web lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DirectiveDrift.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: src/DirectiveDrift.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  browser-smoke:
    name: Scripted browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DirectiveDrift.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.202
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: src/DirectiveDrift.Web/package-lock.json
      - run: dotnet restore ../../DirectiveDrift.sln --locked-mode
      - run: dotnet build ../DirectiveDrift.Api/DirectiveDrift.Api.csproj --no-restore
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  api-client:
    name: OpenAPI client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.202
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: src/DirectiveDrift.Web/package-lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet build src/DirectiveDrift.Api/DirectiveDrift.Api.csproj --no-restore
      - run: npm ci --prefix src/DirectiveDrift.Web
      - run: ./scripts/generate-api-client.sh
      - run: git diff --exit-code -- openapi/api-v1.json src/DirectiveDrift.Web/src/api/generated

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
